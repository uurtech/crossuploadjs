<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Send a file</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="phone-page">
  <main>
    <h1 id="title">Send a file to your computer</h1>
    <p class="muted" id="rules">Connecting…</p>
    <p id="error" class="error" hidden></p>
    <label class="big" id="pick" hidden>
      <span id="pick-label">Choose a photo or document</span>
      <input type="file" id="file" multiple>
    </label>
    <ul id="list" class="files" aria-live="polite"></ul>
    <p id="after" class="muted" hidden>Done? Go back to your computer and continue the form.</p>
  </main>
  <script src="/phone.js"></script>
</body>
</html>
